<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HandPen AI</title>
    <link rel="stylesheet" href="./styles.css?v=camera-simple" />
  </head>
  <body>
    <div class="app ipad-app landscape-app">
      <header class="topbar">
        <div class="brand">
          <h1>HandPen AI</h1>
        </div>
        <div class="status-pills">
          <span id="cameraStatus" class="pill">カメラ: 停止</span>
          <span id="handStatus" class="pill">手: 未検出</span>
          <span id="gripStatus" class="pill">握り: OFF</span>
          <span id="inkStatus" class="pill">インク: OFF</span>
        </div>
        <button id="btnOpenSettings" class="btn settings-btn" type="button">設定</button>
      </header>

      <main class="workspace camera-mode" id="workspace">
        <section class="panel camera-panel" id="cameraPanel">
          <div class="video-wrap">
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="overlay"></canvas>
          </div>
        </section>

        <section class="panel draw-panel" id="drawPanel">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="drawCanvas"></canvas>
            <div id="holdBanner" class="hold-banner">カメラを開始してください</div>
            <div id="toast" class="toast" hidden></div>
          </div>
        </section>
      </main>

      <nav class="action-dock" aria-label="主要操作">
        <div class="control-row">
          <button id="btnStartCamera" class="btn primary">カメラ開始</button>
          <button id="btnSetTip" class="btn" disabled>ペン先を指定</button>
          <button id="btnClear" class="btn" disabled>消去</button>
        </div>
      </nav>
    </div>

    <div id="settingsModal" class="modal" hidden>
      <div class="modal-backdrop" id="settingsBackdrop"></div>
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-header">
          <h2 id="settingsTitle">設定</h2>
          <button id="btnCloseSettings" class="btn" type="button">閉じる</button>
        </div>

        <div class="modal-body">
          <section class="modal-section">
            <h3>使い方</h3>
            <p class="settings-note">
              1. カメラ開始 → 2. ペン握り形で手を見せる → 3.「ペン先を指定」後にキャンバスをタップ →
              4. 握り形のときだけインクが出ます（握りを崩すと止まります）
            </p>
          </section>

          <section class="modal-section">
            <h3>描画オプション</h3>
            <div class="control-grid">
              <label>
                推定の基準
                <select id="estimationMode">
                  <option value="A">A: 人差し指先端</option>
                  <option value="B">B: 親指×人差し指</option>
                  <option value="C" selected>C: 握り+延長</option>
                  <option value="D">D: 三指+延長</option>
                </select>
              </label>

              <label>
                平滑化
                <select id="smoothingMode">
                  <option value="none">なし</option>
                  <option value="ema" selected>EMA</option>
                  <option value="oneEuro">One Euro</option>
                </select>
              </label>

              <label>
                ガイド
                <select id="guideMode">
                  <option value="none">なし</option>
                  <option value="horizontal" selected>水平</option>
                  <option value="vertical">垂直</option>
                  <option value="diagonal">斜め</option>
                </select>
              </label>

              <label>
                ペン長 L
                <input id="penLength" type="range" min="0.02" max="0.30" step="0.01" value="0.12" />
                <span id="penLengthValue">0.12</span>
              </label>

              <label>
                EMA α
                <input id="emaAlpha" type="range" min="0.05" max="1" step="0.05" value="0.30" />
                <span id="emaAlphaValue">0.30</span>
              </label>

              <label>
                握り判定のしきい値
                <input id="gripThreshold" type="range" min="0.35" max="0.85" step="0.05" value="0.55" />
                <span id="gripThresholdValue">0.55</span>
              </label>
            </div>
          </section>

          <section class="modal-section">
            <h3>状態</h3>
            <div id="message" class="message">カメラを開始してください。</div>
            <div id="metrics" class="metrics">grip: — | tip: — | fps: —</div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js?v=camera-simple"></script>
  </body>
</html>
